name: Project label

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const projects = {
              "Avies Waypoints": "project: avies-waypoints",
              "Day Counter": "project: day-counter",
              "Ping Display": "project: ping-display",
              "TabbyLib": "project: tabbylib",
              "Tabby Shaders": "project: tabby-shaders",
            };
            const issue = context.payload.issue;
            const match = (issue.body || "").match(/### Project\r?\n\s*([^\n]+)/);
            const label = match && projects[match[1].trim()];
            if (!label) {
              return;
            }
            const current = issue.labels.map(l => l.name);
            for (const old of current.filter(name => name.startsWith("project: ") && name !== label)) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: old });
            }
            if (!current.includes(label)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [label] });
            }
